<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第42天｜为特会进行守望祷告</title>
<meta property="og:title" content="第42天｜为特会进行守望祷告 · 40天守望禁食祷告">
<meta property="og:description" content="2026遇见神特会 · 守望祷告日">
<meta property="og:url" content="https://janus118.github.io/2026-40-/day42.html">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#171f38;
    --night:#232f52;
    --indigo:#3a4a7a;
    --gold:#cda15f;
    --gold-soft:#e8cf9c;
    --ember:#b5573f;
    --paper:#faf5ea;
    --paper-dim:#f1e9d8;
    --ink:#2b2620;
    --ink-soft:#5c5548;
    --line:#e2d5b8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:#0e1326;
    background-image:
      radial-gradient(ellipse 1200px 550px at 50% -10%, rgba(58,74,122,.55), transparent 60%),
      radial-gradient(ellipse 900px 550px at 50% 110%, rgba(205,161,95,.18), transparent 60%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    font-family:"Noto Sans SC", sans-serif;
  }
  .card{
    width:100%;
    max-width:860px;
    min-height:1080px;
    background:var(--paper);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(10,14,30,.45), 0 2px 0 rgba(255,255,255,.4) inset;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---- Signature: night-to-dawn watch arc ---- */
  .watch{
    position:relative;
    height:200px;
    flex-shrink:0;
    background:linear-gradient(180deg, var(--night-deep) 0%, var(--night) 42%, var(--indigo) 70%, var(--gold) 100%);
    overflow:hidden;
  }
  .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,.85), transparent),
      radial-gradient(1px 1px at 70px 60px, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 130px 20px, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 190px 50px, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 250px 15px, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 310px 40px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 350px 25px, rgba(255,255,255,.8), transparent);
    opacity:.9;
  }
  .glow{
    position:absolute; left:50%; bottom:-90px; width:280px; height:280px;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(233,207,156,.85) 0%, rgba(205,161,95,.35) 45%, transparent 72%);
    filter:blur(2px);
  }
  .watch-eyebrow{
    position:relative; z-index:2;
    padding:22px 26px 0;
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    letter-spacing:.16em;
    color:rgba(255,255,255,.75);
    display:flex; justify-content:space-between; align-items:center;
  }
  .watch-eyebrow .day{
    color:var(--gold-soft);
    font-weight:600;
  }
  .watch-title{
    position:relative; z-index:2;
    padding:14px 26px 0;
    font-family:"Noto Serif SC", serif;
    font-weight:900;
    font-size:28px;
    line-height:1.35;
    color:#fffaf0;
    text-shadow:0 2px 18px rgba(0,0,0,.35);
    text-align:center;
  }
  .watch-sub{
    position:relative; z-index:2;
    padding:8px 26px 0;
    font-size:15.5px;
    color:rgba(255,255,255,.7);
    letter-spacing:.02em;
    text-align:center;
  }

  /* ---- Body ---- */
  .body{ padding:26px 26px 30px; flex:1; display:flex; flex-direction:column; justify-content:flex-start; }

  .tag-row{
    display:flex; gap:8px; flex-wrap:wrap;
    margin-bottom:20px;
  }
  .tag{
    font-size:11.5px;
    font-family:"IBM Plex Mono", monospace;
    color:var(--ember);
    background:rgba(181,87,63,.08);
    border:1px solid rgba(181,87,63,.25);
    padding:4px 10px;
    border-radius:20px;
    letter-spacing:.03em;
  }

  .section{ margin-bottom:22px; }
  .section-label{
    display:flex; align-items:center; gap:8px;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:10px;
    letter-spacing:.02em;
  }
  .section-label .mark{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(205,161,95,.22);
  }

  .scripture{
    border-left:3px solid var(--gold);
    padding:4px 0 4px 16px;
    margin-bottom:6px;
  }
  .scripture a{
    display:block;
    color:var(--ink);
    text-decoration:none;
    font-family:"Noto Serif SC", serif;
    font-weight:600;
    font-size:15.5px;
    line-height:1.9;
  }
  .scripture a span{
    color:var(--ink-soft);
    font-weight:400;
    font-size:11.5px;
    font-family:"Noto Sans SC", sans-serif;
    display:block;
    margin-top:2px;
  }
  .scripture .hint{
    font-size:11px;
    color:var(--gold);
    margin-top:6px;
    letter-spacing:.02em;
  }

  .prose{
    font-size:14px;
    line-height:1.95;
    color:var(--ink-soft);
  }

  .prayer-box{
    background:linear-gradient(180deg, #fff9ef, var(--paper-dim));
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 16px;
  }
  .prayer-box .prose{ color:var(--ink); }

  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:4px 0 14px;
  }
  .ornament::before, .ornament::after{
    content:"";
    height:1px;
    width:40px;
    background:linear-gradient(90deg, transparent, var(--gold));
  }
  .ornament::after{
    background:linear-gradient(90deg, var(--gold), transparent);
  }
  .ornament .diamond{
    width:7px; height:7px;
    background:var(--gold);
    transform:rotate(45deg);
    box-shadow:0 0 0 4px rgba(205,161,95,.18);
  }

  .feature-heading{
    text-align:center;
    margin-bottom:32px;
  }
  .feature-heading .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--ember);
    margin-bottom:10px;
  }
  .feature-heading h2{
    font-family:"Noto Serif SC", serif;
    font-weight:900;
    font-size:26px;
    line-height:1.4;
    color:#a9772f;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
    margin:0;
  }

  .response-card{
    background:linear-gradient(180deg, #fff9ef, var(--paper-dim));
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 24px;
    text-align:center;
  }

  .cross-photo-wrap{
    margin:0 0 32px;
    aspect-ratio:1.8;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 16px 34px rgba(140,100,40,.28), 0 2px 0 rgba(255,255,255,.5) inset;
    position:relative;
  }
  .cross-photo-wrap img{
    width:100%;
    height:100%;
    display:block;
  }
  .cross-photo-wrap::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:18px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .response-card .response{
    padding:0;
    white-space:normal;
    text-align:center;
    font-size:14px;
    line-height:2;
  }
  .prayer-list{ margin-top:10px; }
  .prayer-list li{
    list-style:none;
    display:flex; gap:10px;
    font-size:13.5px;
    line-height:1.8;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .prayer-list li::before{
    content:attr(data-n);
    flex:0 0 auto;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--gold);
    color:#fff;
    font-size:10.5px;
    font-family:"IBM Plex Mono", monospace;
    display:flex; align-items:center; justify-content:center;
    margin-top:2px;
  }

  /* ---- Timeline: 5am / 12pm / 6pm ---- */
  .timeline{
    display:flex;
    justify-content:space-between;
    position:relative;
    padding:10px 4px 0;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left:22px; right:22px; top:16px;
    height:1px;
    background:linear-gradient(90deg, var(--gold), var(--ember), var(--indigo));
    opacity:.4;
  }
  .tl-node{
    position:relative;
    flex:1;
    text-align:center;
  }
  .tl-dot{
    width:12px; height:12px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--gold);
    margin:0 auto 10px;
    position:relative; z-index:2;
  }
  .tl-caption{
    position:absolute;
    top:-38px; left:0; right:0;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    text-align:center;
  }
  .tl-time{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--ember);
    letter-spacing:.03em;
  }
  .tl-names{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:4px;
    line-height:1.5;
  }

  .song-row{
    display:flex; align-items:center; justify-content:center; gap:18px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
  }
  .song-info{ font-size:13.5px; color:var(--ink); }
  .song-info .name{ font-weight:700; }
  .song-link{
    font-size:11.5px;
    font-family:"IBM Plex Mono", monospace;
    color:var(--ember);
    text-decoration:none;
    border-bottom:1px solid var(--ember);
    white-space:nowrap;
  }

  .divider{
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
    margin:10px 0;
  }

  .response{
    font-size:13.5px;
    line-height:1.9;
    color:var(--ink-soft);
    font-style:normal;
    padding:2px 2px 20px;
    text-align:left;
  }

  .cta-wrap{ display:none; }
  .response .amen{ color:var(--ember); font-weight:600; }

  /* ---- CTA footer ---- */
  .footer{
    background:var(--night-deep);
    padding:22px 22px 26px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .qr-wrap{
    flex:0 0 auto;
    background:var(--paper);
    padding:6px;
    border-radius:10px;
    line-height:0;
  }
  .qr-wrap img{ width:64px; height:64px; display:block; border-radius:4px; }
  .footer-text{ flex:1; }
  .footer-eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--gold-soft);
    margin-bottom:4px;
  }
  .footer-cta{
    color:#fffaf0;
    text-decoration:none;
    font-weight:700;
    font-size:14.5px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .footer-cta .arrow{
    transition:transform .2s ease;
  }
  .footer-cta:hover .arrow{ transform:translateX(3px); }
  .footer-sub{
    font-size:11px;
    color:rgba(255,255,255,.5);
    margin-top:4px;
  }

  @media (prefers-reduced-motion: no-preference){
    .glow{ animation:pulse 6s ease-in-out infinite; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.9; transform:translateX(-50%) scale(1); }
    50%{ opacity:1; transform:translateX(-50%) scale(1.08); }
  }

  a:focus-visible, .footer-cta:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  @media (max-width:600px){
    html,body{ padding:0; align-items:flex-start; min-height:0; }
    .card{ max-width:100%; border-radius:0; box-shadow:none; min-height:0; }
    .watch{ height:auto; padding-bottom:20px; }
    .watch-eyebrow{
      flex-direction:column;
      align-items:flex-start;
      gap:4px;
      letter-spacing:.06em;
      font-size:11px;
      padding:20px 20px 0;
    }
    .watch-eyebrow .day{ white-space:nowrap; }
    .watch-title{ font-size:23px; padding:12px 20px 0; line-height:1.4; }
    .watch-sub{ font-size:13.5px; padding:8px 20px 0; }
    .body{ padding:22px 20px 30px; }
  }
</style>
</head>
